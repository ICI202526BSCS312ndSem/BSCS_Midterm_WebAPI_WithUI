<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>student Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #f4f7f6;
        }

        .navbar {
            margin-bottom: 30px;
        }

        .card {
            border: none;
            border-radius: 10px;
        }

        .table img {
            width: 50px;
            height: 50px;
            object-fit: cover;
            border-radius: 5px;
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow">
        <div class="container">
            <a class="navbar-brand" href="home.html">Student List</a>
            <div class="d-flex">
                <span class="navbar-text me-3" id="userDisplay"></span>
                <button class="btn btn-outline-light btn-sm" onclick="logout()">Logout</button>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="card shadow-sm">
            <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
                <h5 class="mb-0">student List</h5>
                <button class="btn btn-primary" onclick="openAddModal()">
                    <i class="fas fa-plus"></i> Add New student
                </button>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead class="table-light">
                            <tr>
                                <th>Id</th>
                                <th>Student Number</th>
                                <th>Student Name</th>
                                <th>Course</th>
                                <th>Year</th>
                                <th>Section</th>
                                <th class="text-center">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="studentTableBody">
                        </tbody>
                    </table>
                </div>
                <div id="loader" class="text-center my-5">
                    <div class="spinner-border text-primary" role="status"></div>
                    <p>Loading students...</p>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="studentModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <form id="studentForm">
                    <div class="modal-header">
                        <h5 class="modal-title" id="modalTitle">Add student</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label">ID</label>
                            <input type="text" id="pId" class="form-control" disabled>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Student Number</label>
                            <input type="text" id="pStudentNumber" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Student Name</label>
                            <input type="text" id="pFullName" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Course</label>
                            <input type="text" id="pCourse" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Year</label>
                            <input type="number" step="1" id="pYear" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Section</label>
                            <input type="number" step="1" id="pSection" class="form-control" required>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary">Save student</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const API_URL = 'https://localhost:7062/api/student';
        const token = localStorage.getItem('token');

        $(document).ready(function () {
            // Redirect if not logged in
            //if (!token) { window.location.href = '../login.html'; }

            loadstudents();

            // Form Submit Handler (Handles both POST and PUT)
            $('#studentForm').on('submit', function (e) {
                e.preventDefault();
                savestudent();
            });
        });

        function loadstudents() {
            $('#loader').show();
            $.ajax({
                url: API_URL,
                type: 'GET',
                headers: { 'Authorization': 'Bearer ' + token },
                success: function (data) {
                    let rows = '';
                    data.forEach(p => {
                        rows += `
                        <tr>
                            <td>${p.id}</td>
                            <td class="fw-bold">${p.studentNumber}</td>
                            <td class="fw-bold">${p.fullName}</td>
                            <td>${p.course}</td>
                            <td>${p.year}</td>
                            <td>${p.section}</td>
                            <td class="text-center">
                                <button class="btn btn-sm btn-outline-primary me-1" onclick="openEditModal(${p.id})">
                                    <i class="fas fa-edit"></i>
                                </button>
                                <button class="btn btn-sm btn-outline-danger" onclick="deletestudent(${p.id})">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </td>
                        </tr>`;
                    });
                    $('#studentTableBody').html(rows);
                    $('#loader').hide();
                },
                error: function () {
                    alert('Failed to load students. Check API or Token.');
                    $('#loader').hide();
                }
            });
        }

        function openAddModal() {
            $('#studentForm')[0].reset();
            $('#pStudentNumber').val('');
            $('#pFullName').val('');
            $('#pCourse').val('');
            $('#pYear').val('');
            $('#pSection').val('');
            
            $('#modalTitle').text('Add New student');
            $('#studentModal').modal('show');
        }

        function openEditModal(id) {
            $.ajax({
                url: `${API_URL}/${id}`,
                type: 'GET',
                headers: { 'Authorization': 'Bearer ' + token },
                success: function (p) {
                    $('#pId').val(p.id);
                    $('#pStudentNumber').val(p.studentNumber);
                    $('#pFullName').val(p.fullName);
                    $('#pCourse').val(p.course);
                    $('#pYear').val(p.year);
                    $('#pSection').val(p.section);
                    $('#modalTitle').text('Edit student');
                    $('#studentModal').modal('show');
                }
            });
        }

        function savestudent() {
            const id = $('#pId').val();
            const studentData = {
                studentNumber: $('#pStudentNumber').val(),
                fullName: $('#pFullName').val(),
                course: $('#pCourse').val(),
                year: $('#pYear').val(),
                section: $('#pSection').val()
            };

            const method = id ? 'PUT' : 'POST';
            const url = id ? `${API_URL}/${id}` : API_URL;

            $.ajax({
                url: url,
                type: method,
                headers: { 'Authorization': 'Bearer ' + token },
                contentType: 'application/json',
                data: JSON.stringify(studentData),
                success: function () {
                    $('#studentModal').modal('hide');
                    loadstudents();
                },
                error: function () { alert('Error saving student'); }
            });
        }

        function deletestudent(id) {
            if (confirm('Are you sure you want to delete this student?')) {
                $.ajax({
                    url: `${API_URL}/${id}`,
                    type: 'DELETE',
                    headers: { 'Authorization': 'Bearer ' + token },
                    success: function () { loadstudents(); }
                });
            }
        }

        function logout() {
            localStorage.removeItem('token');
            //window.location.href = '../login.html';
        }
    </script>

</body>
</html>
